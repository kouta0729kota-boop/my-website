<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ストップ・ウォッチ・ガーデン - 軽量AR演出</title>
  <!-- A-Frame ライブラリ -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- MindAR for A-Frame ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    /* 画面全体を包み込むエフェクト用レイヤー (最初は非表示) */
    #flash-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.8) 0%, rgba(0, 191, 255, 0.6) 70%, rgba(0, 0, 0, 0) 100%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.5s ease-in-out;
      z-index: 10;
    }

    /* マーカー認識時に発動するフラッシュアニメーションクラス */
    #flash-overlay.active {
      opacity: 1;
      animation: pulse-flash 1.5s infinite alternate;
    }

    @keyframes pulse-flash {
      0% {
        opacity: 0.7;
      }

      100% {
        opacity: 1;
      }
    }

    /* UIメッセージのスタイル */
    #ui-message {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #FFD700;
      padding: 12px 24px;
      border-radius: 20px;
      font-family: sans-serif;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1px;
      z-index: 20;
      display: none;
      border: 2px solid #FFD700;
      text-align: center;
    }
  </style>
</head>

<body>
  <!-- HTML/CSSによる演出レイヤー -->
  <div id="flash-overlay"></div>
  <div id="ui-message">時空同期完了:【時】【刻】【動】<br>公園の時間が動き出す...!</div>

  <!-- MindARシステムの初期化 -->
  <a-scene mindar-image="imageTargetSrc: ./assets/rose-marker.mind;" color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    <a-assets>
      <!-- テクスチャや素材の事前読み込み -->
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- バラのマーカーを認識したときに発火するターゲット (ニュース側が何番目かによってtargetIndexを変更: 例では0) -->
    <a-entity id="ar-target" mindar-image-target="targetIndex: 0">

      <!-- 1. 光る「記憶のバラ」の立体表現 -->
      <a-sphere position="0 0 0" radius="0.15" color="#ff3366" material="emissive: #ff1493; emissiveIntensity: 0.8"
        animation="property: position; to: 0 0.4 0; dir: alternate; dur: 1200; loop: true"></a-sphere>

      <!-- 2. 時計の歯車(コードによる3Dアニメーション表現) -->
      <!-- 外側の歯車(時計回りに回転) -->
      <a-torus position="0 0 -0.2" radius="0.4" radius-tubular="0.03" color="#DAA520" metalness="0.9" roughness="0.2"
        animation="property: rotation; to: 0 0 360; dur: 4000; easing: linear; loop: true"></a-torus>

      <!-- 内側の歯車(反時計回りに逆回転させてギミック感を演出) -->
      <a-torus position="0 0 -0.2" radius="0.25" radius-tubular="0.02" color="#CD7F32" metalness="0.9" roughness="0.2"
        animation="property: rotation; to: 0 0 -360; dur: 3000; easing: linear; loop: true"></a-torus>

      <!-- 中央の時計盤面風プレート -->
      <a-circle position="0 0 -0.22" radius="0.2" color="#FFF8DC" material="side: double">
        <a-text value="12" position="-0.04 0.1 0" color="#333" scale="0.4 0.4 0.4"></a-text>
        <a-text value="3" position="0.08 0 0" color="#333" scale="0.4 0.4 0.4"></a-text>
        <a-text value="6" position="-0.02 -0.1 0" color="#333" scale="0.4 0.4 0.4"></a-text>
        <a-text value="9" position="-0.12 0 0" color="#333" scale="0.4 0.4 0.4"></a-text>
      </a-circle>

      <!-- 3. 浮遊するテキスト演出 -->
      <a-text value="TIME RESTORED" position="0 1.3 -0.2" align="center" color="#00ffff" scale="0.8 0.8 0.8"
        animation="property: position; to: 0 1.4 -0.2; dir: alternate; dur: 1000; loop: true"></a-text>

    </a-entity>
  </a-scene>

  <script>
    const targetEntity = document.querySelector('#ar-target');
    const flashOverlay = document.querySelector('#flash-overlay');
    const uiMessage = document.querySelector('#ui-message');

    // マーカーを検出したとき
    targetEntity.addEventListener('targetFound', () => {
      console.log("バラのマーカー検出: 時空同期スタート");
      flashOverlay.classList.add('active'); // 画面を金色・青く光らせる
      uiMessage.style.display = 'block'; // テキストUIを表示
    });

    // マーカーを見失ったとき
    targetEntity.addEventListener('targetLost', () => {
      console.log("マーカーロスト");
      flashOverlay.classList.remove('active');
      uiMessage.style.display = 'none';
    });
  </script>
</body>

</html>
